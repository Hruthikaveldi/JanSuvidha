services:

  mongodb:
    image: mongo:7
    container_name: jansuvidha-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - jansuvidha-net

  backend:
    build: ./backend
    container_name: jansuvidha-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/jansuvidha
      - JWT_SECRET=jansuvidha_super_secret_2024
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - jansuvidha-net

  frontend:
    build: ./frontend
    container_name: jansuvidha-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - jansuvidha-net

volumes:
  mongo-data:

networks:
  jansuvidha-net:
    driver: bridge